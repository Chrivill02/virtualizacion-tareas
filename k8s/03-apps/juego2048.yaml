apiVersion: apps/v1
kind: Deployment
metadata:
  name: juego2048
  namespace: parcial-cavv
  labels:
    app: juego2048
spec:
  replicas: 2
  selector:
    matchLabels:
      app: juego2048
  template:
    metadata:
      labels:
        app: juego2048
    spec:
      containers:
        - name: juego2048
          image: public.ecr.aws/l6m2t8p7/docker-2048:latest
          # La imagen escribe los logs de nginx en archivos dentro del contenedor.
          # Se mandan a stdout/stderr para que el kubelet los guarde y Promtail los lea.
          command: ["/bin/sh", "-c"]
          args:
            - ln -sf /dev/stdout /var/log/nginx/access.log &&
              ln -sf /dev/stderr /var/log/nginx/error.log &&
              exec nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: juego2048
  namespace: parcial-cavv
spec:
  type: ClusterIP
  selector:
    app: juego2048
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: juego2048
  namespace: parcial-cavv
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: juego.parcial.dominio
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: juego2048
                port:
                  name: http
