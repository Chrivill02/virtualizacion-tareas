# Pagina HTML que sirve nginx
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html
  namespace: parcial-cavv
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="es">
    <head><meta charset="utf-8"><title>Nginx - parcial-cavv</title></head>
    <body style="font-family: sans-serif; text-align: center; margin-top: 10%;">
      <h1>Nginx servido por Traefik + MetalLB</h1>
      <p>Namespace: <b>parcial-cavv</b> &middot; Host: <b>nginx.parcial.dominio</b></p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: parcial-cavv
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: nginx-html
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: parcial-cavv
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Traefik manda todo lo que llegue a nginx.parcial.dominio hacia el servicio nginx
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: parcial-cavv
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: nginx.parcial.dominio
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  name: http
